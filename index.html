<script>
const sections = [
  {
    id: "financial", name: "Financial state",
    tagline: "How you relate to money and stability",
    dot: "💰", bg: "#D4E8D8",
    questions: [
      { type: "choice", q: "How would you describe your current financial situation?", opts: ["Stable and comfortable", "Getting by month to month", "Building from the ground up", "In debt but managing", "Financially stressed"] },
      { type: "choice", q: "Do you have personal savings or an emergency fund?", opts: ["Yes, well prepared", "A little bit saved", "Working on it", "Not yet"] },
      { type: "choice", q: "How do you generally feel about spending money?", opts: ["I plan carefully before spending", "I spend freely but responsibly", "I tend to be impulsive", "I'm very frugal"] },
      { type: "text", q: "What is one financial goal you want to achieve in the next 3 years?" },
      { type: "choice", q: "Who do you think should manage finances in a marriage?", opts: ["Both together equally", "The one who earns more", "The husband", "The wife", "Separate finances"] }
    ]
  },
  {
    id: "family", name: "Family background",
    tagline: "Your roots and what you carry forward",
    dot: "🏡", bg: "#E8D4D4",
    questions: [
      { type: "choice", q: "How would you describe your relationship with your parents?", opts: ["Very close and open", "Respectful but distant", "Complicated or difficult", "One parent absent", "Both parents not in the picture"] },
      { type: "choice", q: "Do you feel your upbringing shaped you in a positive way overall?", opts: ["Yes, very much so", "Mostly yes", "Mixed — some good, some hard", "Not really", "Still figuring that out"] },
      { type: "text", q: "What is one thing about your family that you deeply value and want to carry into your own home?" },
      { type: "choice", q: "How involved do you want your family to be after marriage?", opts: ["Very involved — family comes first", "Involved but with boundaries", "Occasional visits and calls", "Mostly independent", "Depends on the situation"] },
      { type: "choice", q: "Are you aware of any family patterns you are actively working to avoid?", opts: ["Yes, very aware and working on it", "Somewhat aware", "I don't think it affects me", "I haven't thought about it much"] }
    ]
  },
  {
    id: "social", name: "Social state",
    tagline: "How you show up in the world",
    dot: "🤝", bg: "#D4DCE8",
    questions: [
      { type: "choice", q: "How would you describe your social life?", opts: ["Very active — lots of friends", "Moderate — a close circle", "Mostly online connections", "Quite private and introverted", "I prefer one-on-one"] },
      { type: "choice", q: "How do you handle conflict with people close to you?", opts: ["Talk it out calmly", "Go quiet and need time first", "Tend to get emotional", "Avoid the topic altogether", "Depends on the situation"] },
      { type: "text", q: "Describe a friendship you are proud of and what makes it special." },
      { type: "choice", q: "How do people who know you well usually describe you?", opts: ["Warm and caring", "Reliable and responsible", "Fun and energetic", "Quiet but thoughtful", "Strong-willed and independent"] },
      { type: "choice", q: "How do you behave in new social settings?", opts: ["Comfortable and open quickly", "Takes me a little time", "I stay quiet and observe", "I find it draining but manage", "Very uncomfortable"] }
    ]
  },
  {
    id: "personality", name: "Personality & emotional",
    tagline: "Who you are on the inside",
    dot: "🌿", bg: "#E8D4E4",
    questions: [
      { type: "choice", q: "When something is bothering you emotionally, what do you usually do?", opts: ["Talk to someone I trust", "Journal or reflect alone", "Distract myself", "Hold it in", "React immediately, then regret it"] },
      { type: "choice", q: "How would you honestly rate your emotional maturity?", opts: ["Very mature — I manage well", "Growing — still learning", "Work in progress", "I struggle with it", "Not sure"] },
      { type: "text", q: "What is your biggest personal weakness that you are aware of and trying to improve?" },
      { type: "choice", q: "What does love and care look like to you in a relationship?", opts: ["Words of affirmation", "Quality time together", "Acts of service", "Physical affection", "Gifts and gestures"] },
      { type: "choice", q: "How do you handle criticism from a loved one?", opts: ["Take it constructively", "Feel hurt but reflect later", "Get defensive first", "Shut down emotionally", "Depends on how it's delivered"] }
    ]
  },
  {
    id: "spiritual", name: "Spiritual & religious",
    tagline: "What you believe and hold sacred",
    dot: "✨", bg: "#DDD4E8",
    questions: [
      { type: "choice", q: "How important is religion or spirituality in your daily life?", opts: ["Central to everything I do", "Important but privately practiced", "Cultural — I follow tradition", "Moderately present", "Not very important to me"] },
      { type: "choice", q: "How do you feel about raising children with religious values?", opts: ["Very important — a must", "Would prefer it", "Open and flexible", "Leave it up to the child", "Not a priority for me"] },
      { type: "text", q: "What is one personal belief or value that is non-negotiable for you in a life partner?" },
      { type: "choice", q: "Could you be with someone from a slightly different religious background?", opts: ["Yes, easily", "Possibly, with understanding", "Would need deep conversation", "Probably not", "Not at all"] },
      { type: "choice", q: "How do you practice your faith or values regularly?", opts: ["Daily prayers or rituals", "Weekly observance", "On important occasions", "Through how I treat people", "Personal and private"] }
    ]
  },
  {
    id: "health", name: "Health & lifestyle",
    tagline: "How you live and take care of yourself",
    dot: "🌱", bg: "#D4E8E4",
    questions: [
      { type: "choice", q: "How would you describe your physical health overall?", opts: ["Very healthy and active", "Generally good with minor issues", "Managing a chronic condition", "Not great — working on it", "I don't pay much attention"] },
      { type: "choice", q: "How do you manage stress in your daily life?", opts: ["Exercise or physical activity", "Talking to someone", "Rest and alone time", "Hobbies or creative outlets", "I mostly carry it without releasing it"] },
      { type: "text", q: "What does a typical day look like for you from morning to night?" },
      { type: "choice", q: "Is there any health condition (physical or mental) a partner should know about?", opts: ["Nothing significant", "Something minor but managed", "Yes, and I'm open about it", "Yes, still figuring out how to share"] },
      { type: "choice", q: "What kind of lifestyle do you envision in your home after marriage?", opts: ["Calm and structured", "Social and lively", "Balanced between both", "Adventurous and spontaneous", "Simple and minimal"] }
    ]
  }
];

const answers = {};
let totalQ = 0;

function render() {
  const area = document.getElementById("questions-area");
  if(!area) return;
  
  let html = "";
  let qNum = 0;
  sections.forEach(sec => {
    html += `<div class="section-block">
      <div class="section-head">
        <div class="section-dot" style="background:${sec.bg}">${sec.dot}</div>
        <div class="section-info">
          <div class="section-name">${sec.name}</div>
          <div class="section-tagline">${sec.tagline}</div>
        </div>
        <span class="answered-badge" id="badge-${sec.id}">0 / ${sec.questions.length}</span>
      </div>`;
    sec.questions.forEach((q, qi) => {
      qNum++;
      const key = `${sec.id}_${qi}`;
      html += `<div class="q-block" style="animation-delay:${qi * 0.05}s">
        <label class="q-label"><span class="q-num">${qNum}.</span> ${q.q}</label>`;
      if (q.type === "choice") {
        html += `<div class="choices">`;
        q.opts.forEach(opt => {
          html += `<button type="button" class="choice-btn" data-key="${key}" data-val="${opt}" onclick="pick(this)">${opt}</button>`;
        });
        html += `</div>`;
      } else {
        html += `<textarea class="text-input" rows="2" name="${key}" placeholder="Write your thoughts here…" data-key="${key}" oninput="typed(this)"></textarea>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  });
  area.innerHTML = html;
  totalQ = qNum;
}

function pick(btn) {
  const key = btn.dataset.key;
  document.querySelectorAll(`[data-key="${key}"]`).forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  answers[key] = btn.dataset.val;

  let hidden = document.querySelector(`input[id="hidden-${key}"]`);
  if (!hidden) {
    hidden = document.createElement("input");
    hidden.type = "hidden";
    hidden.id = `hidden-${key}`;
    hidden.name = key;
    document.getElementById("assessment-form").appendChild(hidden);
  }
  hidden.value = btn.dataset.val;
  updateProgress();
}

function typed(el) {
  answers[el.dataset.key] = el.value.trim();
  updateProgress();
}

function updateProgress() {
  const done = Object.values(answers).filter(v => v && v.length > 0).length;
  const pct = Math.round((done / totalQ) * 100);
  
  const progFill = document.getElementById("prog");
  if(progFill) progFill.style.width = pct + "%";
  
  const progText = document.getElementById("prog-text");
  if(progText) progText.textContent = `${done} of ${totalQ} answered`;
  
  const progPct = document.getElementById("prog-pct");
  if(progPct) progPct.textContent = pct + "%";

  sections.forEach(sec => {
    const secDone = sec.questions.filter((q, qi) => {
      const v = answers[`${sec.id}_${qi}`];
      return v && v.length > 0;
    }).length;
    const badge = document.getElementById(`badge-${sec.id}`);
    if (badge) badge.textContent = `${secDone} / ${sec.questions.length}`;
  });
}

document.getElementById("assessment-form").addEventListener("submit", function(e) {
  e.preventDefault();
  
  const form = this;
  const button = document.getElementById("submit-button");
  button.disabled = true;
  button.textContent = "Sending...";

  const formData = new FormData(form);

  fetch(form.action, {
    method: "POST",
    body: formData,
    headers: {
      'Accept': 'application/json'
    }
  })
  .then(response => {
    if (response.ok) {
      document.getElementById("main-form").style.display = "none";
      document.getElementById("thank-you").style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      alert("Something went wrong. Please check your data or try again.");
      button.disabled = false;
      button.textContent = "Submit Answers";
    }
  })
  .catch(error => {
    alert("Network error. Please check your connection.");
    button.disabled = false;
    button.textContent = "Submit Answers";
  });
});

render();
</script>
